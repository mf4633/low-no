name: low-no scan
on:
  schedule:
    # TWO fires per hour, 9a-7p ET. GitHub's scheduled cron is best-effort and
    # silently DROPS fires under load: 2026-08-26 delivered 5 of 11 hours
    # (13:59, 14:56, 16:26, 19:14 for nominal :05 slots) while every prior day
    # got all 11. Runs take ~7 min and the concurrency group serializes them,
    # so a second slot costs little and gives each hour a second chance.
    # Duplicate fires in one hour are harmless: the scan is idempotent
    # telemetry and shadow dedups to one unit per city-day.
    - cron: "5 13-23 * * *"    # :05 - 9:05a-7:05p ET
    - cron: "35 13-23 * * *"   # :35 - backup slot
  workflow_dispatch: {}
permissions: { contents: write, pages: write, issues: write }
concurrency:
  group: lowno-commit
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: hourly scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m lowno.scan
      - name: commit logs
        if: always()
        run: |
          git config user.name lowno-bot && git config user.email bot@lowno
          git add -A
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash && git push
      - name: request pages rebuild
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
