name: low-no scan
on:
  schedule:
    - cron: "5 13-23 * * *"   # hourly, 9:05a-7:05p ET (13:05-23:05 UTC)
  workflow_dispatch: {}
permissions: { contents: write, pages: write, issues: write }
concurrency:
  group: lowno-commit
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: hourly scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m lowno.scan
      - name: commit logs
        if: always()
        run: |
          git config user.name lowno-bot && git config user.email bot@lowno
          git add -A
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash && git push
      - name: request pages rebuild
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
