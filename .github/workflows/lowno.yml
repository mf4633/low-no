name: low-no scan
on:
  schedule:
    # ONE delivered fire is enough. Each run is a LOOP that keeps scanning on
    # ~55min centres until the window closes, so coverage no longer depends on
    # GitHub delivering every slot.
    #
    # Why: GitHub's scheduled cron is best-effort and silently DROPS fires.
    # 2026-08-26 delivered 5 of 11 nominal slots; 2026-08-27 delivered 0 of 14
    # after the :35 backup was already in place -- non-delivery, not lateness,
    # so adding slots does not help. Both days produced ZERO usable H4a rate
    # samples, because shape_eval.cycles() needs consecutive observations
    # 0.5-2.5h apart and the surviving fires were 2.8h apart.
    #
    # CADENCE IS LOAD-BEARING, do not "improve" it: below 0.5h spacing every
    # pair fails the same gap test and the day silently yields nothing. 55min
    # sits mid-band with margin either side.
    #
    # ONE cron slot, deliberately. The :35 backup was removed 2026-08-31: it was
    # already live on the 0-of-14 day so it never bought coverage, and every
    # extra dispatch feeds the pending-slot churn below -- 12 runs were queued
    # and cancelled on 2026-08-30 without executing. Between this cron, the
    # end-of-run chain and the hourly external trigger there are already three
    # ways to start a run; the loop only needs one to land.
    - cron: "5 13 * * *"       # 9:05a ET cold start
  workflow_dispatch: {}
permissions: { contents: write, pages: write, issues: write }
concurrency:
  # DELIBERATELY NOT the scorecard's group. These jobs now run for hours, and a
  # shared group would let a queued scan evict the pending nightly scorecard --
  # only one run may sit pending per group. Push races are handled by retry in
  # the commit step instead of by serialising whole jobs.
  group: lowno-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # under GitHub's 360min job ceiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ensure yesterday was graded
        # The scorecard has three cron slots and GitHub dropped ALL of them on
        # 2026-08-28, leaving 8/27 unsettled and its whole day of observations
        # ungraded (44 rate samples, invisible until a manual dispatch). Grading
        # is what turns collection into H4a samples, so do not leave it to the
        # scheduler: any scan run that notices yesterday is unsettled kicks the
        # scorecard itself. score_run is idempotent and skips days already
        # settled, so a redundant kick is a cheap no-op.
        #
        # This also bounds the damage from gotcha #11: CLI is fetchable for
        # exactly 7 days, so an ungraded day is on a clock, not merely late.
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          Y=$(TZ=America/New_York date -d yesterday +%F)
          N=$(python -c "import json;s=json.load(open('docs/settlements.json'));print(len([k for k in s if k.startswith('$Y')]))")
          echo "settlement keys for $Y: $N"
          if [ "$N" -gt 0 ]; then echo "already graded"; exit 0; fi
          if [ -z "$DISPATCH_PAT" ]; then
            echo "::warning::$Y is ungraded and DISPATCH_PAT is unset - cannot self-heal, waiting on GitHub's cron"
            exit 0
          fi
          echo "$Y ungraded - dispatching the scorecard"
          curl -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/lowno-score.yml/dispatches" \
            -d '{"ref":"main"}'
      - name: scan loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          . .github/push_retry.sh

          # Start from the CURRENT tip, not from whatever checkout@v4 grabbed.
          # The previous run pushes its final cycle as it exits, and a chained
          # run that checked out moments earlier begins one commit behind --
          # which is exactly the divergence that cost 2026-08-30 six cycles.
          # Nothing local exists to lose at this point in the job.
          git fetch --quiet origin main && git reset --quiet --hard origin/main
          echo "base: $(git rev-parse --short HEAD)"

          STEP=3300                                   # 55 min between centres
          DAY_END=$(date -u -d "today 23:40" +%s)     # stop before the day rolls
          HARD=$(( $(date -u +%s) + 330 * 60 ))       # stay inside the job cap
          END=$DAY_END
          # NB: default shell is `bash -e`, so a bare `[ test ] && act` that
          # evaluates false returns 1 and aborts the step. Always if/fi here.
          if [ "$HARD" -lt "$END" ]; then END=$HARD; fi
          fail=0
          pushfail=0
          i=0
          while :; do
            i=$((i+1))
            echo "=== cycle $i  $(date -u +%FT%H:%MZ) ==="

            # NOT masked (see CLAUDE.md #9): a failed cycle is printed as an
            # annotation and fails the JOB at the end. It just must not cost
            # the remaining hours of collection.
            if python -m lowno.scan; then
              echo "cycle $i ok"
            else
              rc=$?
              fail=1
              echo "::error::scan cycle $i exited $rc"
            fi

            # Commit EVERY cycle. If the runner is killed mid-window, only the
            # cycle in flight is lost, never the whole day. push_retry resolves
            # a conflict on the regenerable snapshots instead of aborting into
            # an unrecoverable retry loop -- see .github/push_retry.sh for the
            # 2026-08-30 failure this replaced.
            git config user.name lowno-bot && git config user.email bot@lowno
            if ! push_retry "scan $(date -u +%FT%H:%MZ)"; then
              fail=1
              pushfail=$((pushfail+1))
            fi

            # Cosmetic only: a failed site rebuild must not end collection.
            # Under `bash -e` a bare failing curl aborts the STEP, which would
            # kill the rest of the day's cycles over a stale web page.
            if ! curl -sS -X POST \
                 -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"; then
              echo "::warning::pages rebuild request failed on cycle $i"
            fi

            if [ $(( $(date -u +%s) + STEP )) -ge "$END" ]; then break; fi
            sleep $STEP
          done
          echo "=== $i cycles, $pushfail unpushed, exit $fail ==="
          # Hand the count to the health step. A cycle that scanned but could
          # not push is INVISIBLE in the committed logs -- the only record that
          # it ever happened is this number, so it must escape the step.
          echo "SCAN_PUSH_FAILURES=$pushfail" >> "$GITHUB_ENV"
          echo "SCAN_CYCLES=$i" >> "$GITHUB_ENV"
          exit $fail

      - name: pipeline health check
        # Runs at the END of the run on purpose. "ensure yesterday was graded"
        # may have dispatched the scorecard hours earlier at the start; checking
        # here gives that time to finish, so a grading race cannot raise a false
        # alarm.
        #
        # Opens a GitHub Issue only when yesterday failed to collect or grade.
        # Nothing alerted on the pipeline before this: 2026-08-26 and 08-27 each
        # produced ZERO H4a rate samples and looked entirely normal, and both
        # were found only because a human happened to ask.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m lowno.health

      - name: hand off to the next run
        # GitHub's scheduler is the binding constraint on this project, not the
        # code: 5/11 scan fires delivered 2026-08-26, 0/14 on 2026-08-27, and on
        # 2026-08-28 two fires at 06:52/07:03Z against a 13-23Z cron plus zero
        # scorecard slots. The loop made ONE delivered fire cover a day; this
        # makes each run start the next, so the crons are only a cold start.
        #
        # Self-limiting by design: chains only inside the collection window, so
        # it stops on its own each night and the morning cron restarts it. That
        # bound is what keeps a bug here from becoming a runaway.
        #
        # `if: always()` so a failed scan still hands off - otherwise one bad
        # cycle silently ends the day, which is the failure this whole change
        # exists to prevent.
        if: always()
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          H=$(date -u +%-H)
          if [ "$H" -ge 23 ] || [ "$H" -lt 11 ]; then
            echo "hour ${H}Z is outside the chain window; the morning cron cold-starts"
            exit 0
          fi
          if [ -z "$DISPATCH_PAT" ]; then
            echo "::warning::DISPATCH_PAT unset - cannot chain; the next run depends on GitHub's cron, which drops fires"
            exit 0
          fi
          echo "chaining the next run"
          curl -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/lowno.yml/dispatches" \
            -d '{"ref":"main"}'
