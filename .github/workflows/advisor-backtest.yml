name: advisor backtest
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: replay graded flags
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python advisor_backtest.py 2>&1 | tee advisor_backtest_out.txt
      - name: commit
        if: always()
        run: |
          git config user.name lowno-bot && git config user.email bot@lowno
          git add -A && git diff --cached --quiet || git commit -m "advisor backtest"
          git pull --rebase --autostash && git push
