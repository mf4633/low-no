name: DISPATCH_PAT check
# Diagnostic only. Prints HTTP STATUS CODES, never the token or any response
# body that could echo it back. Added 2026-08-28 after a token failed with 401
# and there was no way to tell whether the secret was bad, the permissions were
# wrong, or the value had been mangled in transit.
#
# 200/204 = good. 401 = bad credentials (wrong or revoked token).
# 403 = valid token, missing permission (needs Actions: read & write).
# 404 = token cannot see the repo at all (wrong repository selected).
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -z "$DISPATCH_PAT" ]; then
            echo "RESULT: DISPATCH_PAT is EMPTY or unset in this repo"
            exit 1
          fi
          echo "secret is present, length ${#DISPATCH_PAT}"
          case "$DISPATCH_PAT" in
            github_pat_*) echo "shape: fine-grained PAT" ;;
            ghp_*)        echo "shape: classic PAT" ;;
            *)            echo "shape: UNRECOGNISED - not a GitHub token prefix" ;;
          esac

          probe() {
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $DISPATCH_PAT" \
              -H "Accept: application/vnd.github+json" "$1")
            echo "  $2 -> HTTP $code"
          }
          probe "https://api.github.com/user" "identity      "
          probe "https://api.github.com/repos/$GITHUB_REPOSITORY" "repo visible  "
          probe "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows" "actions:read  "
