name: low-no nightly scorecard
on:
  schedule:
    - cron: "5 2 * * *"       # 10:05p ET nightly
  workflow_dispatch: {}
permissions: { contents: write }
concurrency:
  group: lowno-commit
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: nightly scorecard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m lowno.score_run
      - name: commit ledger
        if: always()
        run: |
          git config user.name lowno-bot && git config user.email bot@lowno
          git add -A
          git diff --cached --quiet || git commit -m "scorecard $(date -u +%F)"
          git pull --rebase --autostash && git push
