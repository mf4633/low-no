name: low-no nightly scorecard
on:
  schedule:
    # THREE slots. This job is the one that grades settlements, updates the
    # paper pilot and writes every report -- if it misses, nothing settles and
    # the site silently serves yesterday. GitHub delivers this ~1h late by
    # habit (02:05 nominal -> 03:0x-03:1x actual) and DROPPED it outright on
    # 2026-08-27, the first miss in 31 runs. Re-running is harmless and
    # self-healing by design: score_run skips days already fully settled and
    # shadow_run is a deterministic rebuild, so a later slot that fires after
    # an earlier success is a cheap no-op.
    - cron: "5 2 * * *"       # 10:05p ET
    - cron: "40 4 * * *"      # 12:40a ET backup
    - cron: "20 7 * * *"      # 3:20a ET last chance
  workflow_dispatch: {}
permissions: { contents: write, pages: write }
concurrency:
  group: lowno-commit
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: nightly scorecard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m lowno.score_run
      - name: shadow grade all bands
        if: always()
        run: python shadow_run.py 2>&1 | tee shadow_out.txt
      - name: commit ledger + shadow
        if: always()
        # Uses the same helper as the scan loop. This job had NO retry at all
        # until 2026-08-31 and lost a whole grading run to a rebase race on
        # 2026-08-27 12:43Z ("could not apply 29396a3"). It writes the same
        # docs/*.json snapshots the scan loop writes, from a DIFFERENT
        # concurrency group, so the two can and do collide by design.
        run: |
          . .github/push_retry.sh
          git config user.name lowno-bot && git config user.email bot@lowno
          push_retry "scorecard + shadow $(date -u +%F)"
      - name: request pages rebuild
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
