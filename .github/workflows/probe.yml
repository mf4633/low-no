name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python probe_cli.py 2>&1 | tee probe_out.txt
      - name: commit
        if: always()
        run: |
          git config user.name lowno-bot && git config user.email bot@lowno
          git add -A && git diff --cached --quiet || git commit -m "probe out"
          git pull --rebase --autostash && git push
