[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marchlands"
version = "0.2.0"
description = "A medieval town, trade and war game: land, labour, the road, and the wall"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # stdlib only, on purpose

[project.scripts]
marchlands = "marchlands.__main__:main"

[tool.setuptools.packages.find]
include = ["marchlands*"]
