<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marchlands</title>
<link rel="stylesheet" href="marchlands.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <header id="bar">
    <span id="place">—</span>
    <span id="date" class="dim">—</span>
    <span class="grow"></span>
    <span id="views" class="views">
      <button id="v-town" type="button" aria-pressed="true">the town</button>
      <button id="v-march" type="button" aria-pressed="false">the march</button>
    </span>
    <label id="goodpick" class="dim" hidden>price of
      <select id="good"></select>
    </label>
    <span id="purse">—</span>
  </header>

  <aside id="panel">
    <section id="trade" hidden>
      <h2>the best runs today</h2>
      <ul id="runs"></ul>
      <h2>your carts</h2>
      <ul id="carts"></ul>
    </section>
    <section>
      <h2>the town</h2>
      <div class="row"><label>souls</label><span id="souls">—</span></div>
      <div class="row"><label>mood</label><span id="moodbar" class="meter"><i></i></span></div>
      <div class="row"><label>hands</label><span id="hands">—</span></div>
      <div class="row"><label>wall</label><span id="wallbar" class="meter"><i></i></span></div>
      <div class="row"><label>soldiers</label><span id="soldiers">—</span></div>
    </section>
    <section>
      <h2>what moves the mood</h2>
      <ul id="mood"></ul>
    </section>
    <section>
      <h2>the day's ledger</h2>
      <ul id="ledger"></ul>
    </section>
  </aside>

  <div id="tip" hidden></div>

  <div id="writ" hidden>
    <header><span id="writ-title"></span>
      <button id="writ-close" type="button" aria-label="close">×</button></header>
    <div id="writ-body"></div>
  </div>

  <div id="clock">
    <button type="button" data-do="next">a day</button>
    <button type="button" data-do="next 7">a week</button>
    <button type="button" data-do="next 30">a month</button>
    <button type="button" data-do="hint">what now?</button>
  </div>
  <div id="alarm" hidden></div>

  <footer id="console">
    <ul id="log"></ul>
    <form id="ask" autocomplete="off">
      <span class="prompt">&gt;</span>
      <input id="line" type="text" placeholder="next 7 · build cottage · hint · help" autofocus>
    </form>
  </footer>
</div>
<script src="marchlands.js"></script>
</body>
</html>
